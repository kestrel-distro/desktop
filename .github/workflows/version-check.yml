name: version-check

# The closure is pinned to Arch's exact versions (plan Part E2). This catches
# the drift the pins invite: when Arch bumps one of the libraries, bump our
# PKGBUILD to match, reset pkgrel, refresh checksums, and push. The push to
# packaging/** fires publish-trigger, so the rebuilt package self-publishes.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Sy --noconfirm --needed curl jq pacman-contrib git

      - uses: actions/checkout@v4

      - name: Sync pkgver with Arch
        run: |
          set -euo pipefail
          changed=()
          for lib in hyprutils hyprlang hyprgraphics hyprcursor hyprwire aquamarine qt6-base; do
            pkgsrc="packaging/$lib/PKGBUILD"
            arch_ver="$(curl -fsSL "https://archlinux.org/packages/extra/x86_64/$lib/json/" \
              | jq -r .pkgver)"
            our_ver="$(grep -m1 '^pkgver=' "$pkgsrc" | cut -d= -f2)"
            if [[ "$lib" == "qt6-wayland" ]]; then
              # Branch-based fork: bumping pkgver without rebasing
              # kestrel/*-syncobj onto the new upstream tag would lie about
              # the payload. Flag drift only; rebase manually.
              if [[ "$arch_ver" != "$our_ver" ]]; then
                echo "::warning::$lib drift: ours $our_ver, Arch $arch_ver — rebase the fork branch"
              else
                echo "$lib: in sync at $our_ver"
              fi
              continue
            fi
            if [[ "$arch_ver" != "$our_ver" ]]; then
              echo "$lib: $our_ver -> $arch_ver"
              sed -i "s/^pkgver=.*/pkgver=$arch_ver/" "$pkgsrc"
              sed -i "s/^pkgrel=.*/pkgrel=1/" "$pkgsrc"
              ( cd "packaging/$lib" && updpkgsums )
              changed+=("$lib")
            else
              echo "$lib: in sync at $our_ver"
            fi
          done
          if ((${#changed[@]})); then
            git config user.name "kestrel-bot"
            git config user.email "kestrel-bot@users.noreply.github.com"
            git add packaging
            git commit -m "Sync closure versions with Arch: ${changed[*]}"
            git push
            # publish-trigger only fires on pushes with KESTREL_TRIGGER_TOKEN
            # configured; dispatch directly as a fallback so version bumps
            # self-publish either way.
            if [[ -n "${{ secrets.KESTREL_TRIGGER_TOKEN }}" ]]; then
              curl -fsSL -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.KESTREL_TRIGGER_TOKEN }}" \
                https://api.github.com/repos/kestrel-distro/packages/dispatches \
                -d '{"event_type":"desktop-release","client_payload":{"source":"version-check"}}'
              echo "desktop-release dispatch sent"
            else
              echo "KESTREL_TRIGGER_TOKEN not set; version bump published but no dispatch sent"
            fi
          else
            echo "no drift; nothing to do"
          fi
